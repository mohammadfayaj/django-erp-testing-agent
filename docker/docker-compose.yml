version: "3.9"

services:
  erp-test-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-local}
      - ERP_BASE_URL=${ERP_BASE_URL:-http://erp:8000}
      - ERP_ADMIN_USER=${ERP_ADMIN_USER:-admin}
      - ERP_ADMIN_PASSWORD=${ERP_ADMIN_PASSWORD:-changeme}
      - HEADLESS=true
      - ARTIFACT_DIR=/app/artifacts
    volumes:
      - ../artifacts:/app/artifacts
    depends_on:
      - erp
    networks:
      - erp-network

  erp:
    image: django-erp:latest   # replace with your actual ERP image
    environment:
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=changeme
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
    ports:
      - "8000:8000"
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge
