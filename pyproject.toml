[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-test-agent"
version = "0.1.0"
description = "Agentic ERP testing framework using Playwright and LLM-assisted planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.43.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "networkx>=3.3",
    "pytest-asyncio>=0.23.6",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[project.scripts]
erp-agent = "erp_test_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
